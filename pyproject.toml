[project]
name = "sismos-azuero"
version = "0.1.0"
description = "Historial de sismos en azuero con mapas y archivos multimedia"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Eric Lucero Gonzalez", email = "ericlucerog@gmail.com" }]
dependencies = [
    "global-land-mask>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyproj>=3.8.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pylint>=3",   # incluye pyreverse para diagramas UML
    "pre-commit>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sismos_azuero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errores y pyflakes · I: orden de imports (reemplaza isort) · UP: sintaxis moderna · B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["sismos_azuero"]
